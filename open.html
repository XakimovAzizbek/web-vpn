<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yuklanmoqda...</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0f172a; }
        #fullFrame { width: 100vw; height: 100vh; border: none; display: block; }
        .back-btn { 
            position: fixed; bottom: 20px; right: 20px; background: #ef4444; color: white; 
            padding: 10px 15px; border-radius: 30px; text-decoration: none; font-family: sans-serif; 
            font-weight: bold; font-size: 14px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); z-index: 9999;
        }
        #loading { 
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            color: white; font-family: sans-serif; font-size: 18px; z-index: 1; 
            background: rgba(15, 23, 42, 0.8); padding: 10px 20px; border-radius: 8px;
        }
    </style>
</head>
<body>
    <div id="loading">⏳ Sayt yuklanmoqda...</div>
    <iframe id="fullFrame"></iframe>
    <a href="index.html" class="back-btn">⬅️ Orqaga</a>

    <script>
        const WORKER_URL = "https://webvpn.snip-dev.workers.dev/?url=";
        const params = new URLSearchParams(window.location.search);
        const targetUrl = params.get('url');

        if (targetUrl) {
            const iframe = document.getElementById('fullFrame');
            const loading = document.getElementById('loading');
            
            iframe.src = WORKER_URL + encodeURIComponent(targetUrl);
            
            iframe.onload = () => {
                loading.style.display = 'none';
                document.title = "Proksi - " + targetUrl;
            };
            setTimeout(() => { loading.style.display = 'none'; }, 3000);

        } else {
            document.getElementById('loading').innerText = "❌ URL topilmadi!";
        }
    </script>
</body>
</html>
