<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEB VPN</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; padding: 15px; text-align: center; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .box { background: #1e293b; padding: 20px 15px; border-radius: 12px; max-width: 600px; width: 100%; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        h2 { margin-bottom: 20px; }
        input, button { width: 100%; padding: 14px; margin: 8px 0; border-radius: 8px; border: 1px solid #475569; box-sizing: border-box; font-size: 16px; }
        input { background: #0f172a; color: white; }
        button { background: #38bdf8; color: black; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #7dd3fc; }
        #status { margin-top: 10px; color: #fca5a5; font-weight: bold; word-break: break-word; }
    </style>
</head>
<body>
    <div class="box">
        <h2>🌍 Web Proksi</h2>
        
        <input type="url" id="url" placeholder="Sayt manzilini kiriting (https://...)" required>

        <button id="openBtn">🔓 Ochish</button>
        <div id="status"></div>
    </div>

    <script>
        document.getElementById('openBtn').addEventListener('click', () => {
            const url = document.getElementById('url').value;
            const status = document.getElementById('status');

            if (!url) {
                status.innerText = "Iltimos, sayt manzilini kiriting!";
                return;
            }

            // Manzilni tozalab, open.html sahifasiga yo'naltiramiz
            // URL ni ?url=... ko'rinishida yuboramiz
            window.location.href = `open.html?url=${encodeURIComponent(url)}`;
        });
    </script>
</body>
</html>
