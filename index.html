<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brauzer Proksi — Region tanlash</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="container">
        <h1>🌍 Proksi orqali saytga kirish</h1>
        <p class="subtitle">Avval regionni tanlang, keyin sayt manzilini kiriting.</p>

        <!-- 1-qadam: Region tanlash -->
        <div class="step" id="step-region">
            <label for="region">1. Regionni tanlang:</label>
            <select id="region">
                <option value="">— Tanlang —</option>
                <option value="DE">🇩🇪 Germaniya</option>
                <option value="US">🇺🇸 AQSH</option>
                <option value="GB">🇬🇧 Buyuk Britaniya</option>
                <option value="FR">🇫🇷 Fransiya</option>
                <option value="NL">🇳🇱 Niderlandiya</option>
                <option value="TR">🇹🇷 Turkiya</option>
                <option value="RU">🇷🇺 Rossiya</option>
                <option value="JP">🇯🇵 Yaponiya</option>
            </select>
        </div>

        <!-- 2-qadam: URL kiritish (region tanlanmaguncha yashirin) -->
        <div class="step hidden" id="step-url">
            <label for="url">2. Sayt manzilini kiriting:</label>
            <input type="url" id="url" placeholder="https://example.com" autocomplete="off">
            <button id="open-btn">🔓 Ochish</button>
        </div>

        <!-- Natija / Xatolik -->
        <div id="status" class="status hidden"></div>

        <!-- Natija oynasi -->
        <div id="result-container" class="hidden">
            <h3>Natija:</h3>
            <iframe id="result-frame" sandbox="allow-scripts allow-same-origin"></iframe>
        </div>

        <p class="note">
            ⚠️ Eslatma: Brauzer xavfsizligi sababli to‘liq sahifani proksi orqali ochish cheklangan.
            Ushbu demo API so‘rovlari uchun proksidan foydalanadi.
        </p>
    </div>
    <script src="index.js"></script>
</body>
</html>
