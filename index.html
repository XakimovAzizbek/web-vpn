<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEB VPN</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; padding: 15px; text-align: center; margin: 0; }
        .box { background: #1e293b; padding: 20px 15px; border-radius: 12px; max-width: 600px; margin: auto; }
        input, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #475569; box-sizing: border-box; font-size: 16px; }
        input { background: #0f172a; color: white; margin-top: 15px; }
        button { background: #38bdf8; color: black; font-weight: bold; cursor: pointer; }
        button:disabled { background: #475569; cursor: not-allowed; }
        #status { margin-top: 10px; color: #fca5a5; font-weight: bold; word-break: break-word; }
        #resultFrame { width: 100%; height: 70vh; margin-top: 15px; background: white; border: none; border-radius: 8px; display: none; }
    </style>
</head>
<body>
    <div class="box">
        <h2>🌍 Web Proksi</h2>
        
        <input type="url" id="url" placeholder="Sayt manzilini kiriting (https://...)" required>

        <button id="openBtn">🔓 Ochish</button>
        <div id="status"></div>
    </div>
    
    <iframe id="resultFrame"></iframe>

    <script>
        // SIZNING CLOUDFLARE HAVOLANGIZ
        const WORKER_URL = "https://webvpn.snip-dev.workers.dev/?url=";

        document.getElementById('openBtn').addEventListener('click', () => {
            const url = document.getElementById('url').value;
            const status = document.getElementById('status');
            const iframe = document.getElementById('resultFrame');
            const btn = document.getElementById('openBtn');

            if (!url) {
                status.innerText = "Iltimos, sayt manzilini kiriting!";
                return;
            }

            btn.disabled = true;
            btn.innerText = "⏳ Yuklanmoqda...";
            status.innerText = "";

            iframe.src = WORKER_URL + encodeURIComponent(url);
            iframe.style.display = "block";
            
            iframe.onload = () => {
                btn.disabled = false;
                btn.innerText = "🔓 Ochish";
                status.innerText = "✅ Sayt ochildi!";
            };
        });
    </script>
</body>
</html>
